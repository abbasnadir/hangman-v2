      <path stroke="#A78BFA" d="M 48 54 L 84 18" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" dur="11s" repeatCount="indefinite" calcMode="linear"
