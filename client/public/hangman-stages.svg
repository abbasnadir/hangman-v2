<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hangman stages: the 10 steps of the classic hangman drawing, one per lost life
  (or per slice of time in Countdown mode). Base, pole, beam, rope, head, body,
  arms and legs are drawn in turn; on the last step the figure dies and swings.
  Same geometry as client/components/HangmanFigure.tsx. Pure SVG/SMIL, loops forever.
-->
